# The gate, on every commit (CLAUDE.md).
#
#   "Emitted RTL is not correct until a simulator says it matches the golden model on every
#    vector. This runs in CI on every commit. A change that cannot pass it is not finished."
#
# TWO PLATFORMS, DELIBERATELY. Windows is the primary development target, because that is where
# most users will pip install this -- and it is where the odd failures live. The study hit
# three Windows-only bugs in one week (a cp1252 console crash on an emoji in
# print(), a \v path escape turning scripts\verify into a vertical tab, and CRLF breaking
# multi-line string matching). All three are invisible on Linux, which is where everyone else
# will run it.
#
# THE JOB MUST FAIL WHEN THE SIMULATOR IS MISSING, not skip. tests/conftest.py skips
# `sim`-marked tests when it cannot find one, which is right for a contributor's laptop and
# wrong here: a CI run whose gate silently did not execute is indistinguishable from a green
# one. The "the gate actually ran" step below is what makes that impossible.

name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    # The whole suite runs in ~2 minutes. GitHub's default is 360, which is not a timeout so much
    # as an afternoon -- this is the backstop for anything that stalls outside the apt step.
    timeout-minutes: 30
    strategy:
      fail-fast: false          # a Windows-only failure must not hide a Linux one, or vice versa
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.12']
        include:
          # The floor declared in pyproject.toml. A supported version nothing ever runs on is a
          # claim, not a fact -- and this job is what turns it into one. It also covers the
          # <3.11 path where tomllib is absent.
          - os: ubuntu-latest
            python: '3.10'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # yosys is Linux-only here on purpose. `estimate` is the one feature the roadmap calls
      # optional, and it is ~9 MB from apt against a 564 MB OSS CAD Suite download on Windows --
      # which also ships its own iverilog and would shadow the simulator the gate runs against.
      # Covering `estimate` on one platform is enough; the gate itself runs on both.
      # ⚠️ apt WAITS RATHER THAN FAILS, and a waiting job looks like a working one.
      #
      # MEASURED from a real run's log, after a first guess (the dpkg lock) was wrong: the
      # runner's azure.archive.ubuntu.com mirror is unreachable, every item against it is `Ign`d
      # after apt's DEFAULT 120-SECOND TIMEOUT, and only then does the mirrorlist fall back to
      # archive.ubuntu.com, which works. The wait is the timeout, not a lock and not yosys.
      #
      # ⚠️ ~~Acquire::Retries=3~~ -- withdrawn as a no-op, and ~~"my retries flag caused the four
      # attempts"~~ was wrong: a run WITHOUT the flag showed the same four. Ubuntu 24.04 defaults
      # Acquire::Retries to 3, so the retries were never ours to remove.
      #
      # ⚠️ ~~Short timeouts are the fix~~ -- withdrawn too. Measured: with 10s timeouts the step
      # still ran 15 minutes and timed out. Shrinking each attempt does not help when EVERY index
      # item pays its own retry cycle against the dead host first. So do not tune the waiting --
      # REMOVE THE DEAD MIRROR. The runner's /etc/apt/apt-mirrors.txt lists azure first and apt
      # falls back to archive.ubuntu.com only after exhausting it; pointing that file at the
      # working mirror skips the whole storm. Timeouts stay as cheap insurance.
      #
      # DPkg::Lock::Timeout is kept as cheap insurance against the lock contention that was the
      # first hypothesis -- it costs nothing when the lock is free. NEEDRESTART_MODE stops
      # Ubuntu 24.04 prompting on a pulled-in library (-y answers apt, not needrestart).
      # timeout-minutes bounds the step regardless: the suite runs in ~2 minutes, so a stall is
      # a failure and should read as one rather than as a six-hour green spinner.
      - name: Install iverilog and yosys (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 15
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: |
          set -x
          # The mirrorlist the runner ships puts the unreachable azure mirror first. Replace it
          # with the mirror apt already falls back to and succeeds on -- see the Hit:/Get: lines
          # for archive.ubuntu.com in any of the slow runs.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            cat /etc/apt/apt-mirrors.txt
            echo 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get update \
            -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15
          sudo apt-get install -y -o DPkg::Lock::Timeout=600 \
            -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 \
            iverilog yosys verilator
          iverilog -V | head -1
          yosys -V

      # macOS was listed as supported from the first release and had never once run. A
      # supported platform nothing executes on is a claim, not a fact -- the same reasoning that
      # put the 3.10 floor in the matrix. Homebrew has iverilog; verilator and yosys are left to
      # the Linux jobs, since one platform's coverage of the optional tools is enough.
      - name: Install iverilog (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 20
        run: |
          brew install icarus-verilog
          iverilog -V | head -1

      # winget is not available on GitHub's Windows runners; Chocolatey is preinstalled.
      #
      # ⚠️ choco CAN EXIT 0 HAVING INSTALLED NOTHING, twice observed. The community feed
      # rate-limits (runners share IPs) and has returned 503, and in both cases choco printed
      # "Chocolatey installed 0/0 packages" and exited ZERO. Retries are right for a transient
      # feed -- but they must key on whether iverilog is REACHABLE, never on the exit code, or
      # the loop breaks after one attempt believing it succeeded. That is what happened.
      #
      # An install that achieved nothing must fail AT THE INSTALL, naming where it looked,
      # rather than surfacing three steps later as a missing simulator.
      #
      # ⚠️ It deliberately does NOT add iverilog to PATH. verify.py's fallback search IS the
      # Windows user's path (winget installs to C:\iverilog\bin and adds nothing to PATH), so
      # handing CI a tidied-up environment would stop exercising the code real users hit.
      - name: Install iverilog (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 20
        run: |
          # ⚠️ Exit codes are managed by hand here. GitHub runs pwsh with
          # $ErrorActionPreference='stop', and PowerShell 7.3+ can turn a native command's
          # non-zero exit into a TERMINATING error -- which would fail this step on
          # `iverilog -V`, a command that exits 255 when it is working perfectly (verify.py:74).
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false

          # Ask the question verify.py asks, in its order: PATH first, then the installer
          # directories. Chocolatey writes SHIMS into C:\ProgramData\chocolatey\bin (on PATH)
          # rather than using the winget layout, so a directory-only check fails a working
          # install -- that happened once already.
          function Find-Iverilog {
            $onPath = (Get-Command iverilog -ErrorAction SilentlyContinue).Source
            if ($onPath) { return $onPath }
            @('C:\iverilog\bin',
              'C:\Program Files\iverilog\bin',
              'C:\Program Files (x86)\iverilog\bin') |
              ForEach-Object { Join-Path $_ 'iverilog.exe' } |
              Where-Object { Test-Path $_ } | Select-Object -First 1
          }

          # ⚠️ RETRY ON REACHABILITY, NEVER ON EXIT CODE. `choco install` printed
          # "Chocolatey installed 0/0 packages" and exited 0 when the community feed returned
          # 503, so a loop keyed on $LASTEXITCODE broke out after one attempt and treated a
          # failed install as success. The feed being briefly unavailable is exactly what these
          # retries are for, so the loop asks the only question that matters: is it there yet?
          $exe = Find-Iverilog
          for ($i = 1; $i -le 3 -and -not $exe; $i++) {
            choco install iverilog --no-progress -y
            $exe = Find-Iverilog
            if ($exe) { break }
            Write-Host "attempt ${i}: choco exited $LASTEXITCODE and no iverilog is reachable"
            if ($i -lt 3) { Start-Sleep -Seconds 45 }
          }

          if (-not $exe) {
            Write-Host 'FATAL: no iverilog after 3 attempts. The gate cannot run.'
            Write-Host '--- what chocolatey thinks it installed ---'
            try { choco list } catch { Write-Host "(choco list failed: $_)" }
            Write-Host '--- PATH ---'
            $env:PATH -split ';' | ForEach-Object { Write-Host "  $_" }
            exit 1
          }
          $version = (& $exe -V 2>&1 | Select-Object -First 1)
          Write-Host "iverilog at $exe -- $version"
          exit 0    # never inherit -V's 255

      - name: Install the package
        run: pip install -e ".[dev]"

      - name: The gate actually ran
        shell: bash
        run: |
          python - <<'PY'
          import sys
          from dwn2rtl.verify import SimulatorNotFound, find_simulator
          try:
              sim = find_simulator()
          except SimulatorNotFound as e:
              # Not a skip. conftest.py would quietly skip every gate test from here, and the
              # run would go green having verified nothing.
              print('FATAL: no simulator in CI.\n', e)
              sys.exit(1)
          print('simulator:', sim.describe())
          PY

      # Same reasoning as the step above, one notch weaker. `estimate` is optional, so its tests
      # SKIP without yosys and that is correct -- but on a runner where we just installed it, a
      # skip means the estimate tests silently did not run and the install achieved nothing.
      - name: The estimate tests can actually run (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python - <<'PY'
          import sys
          from dwn2rtl.estimate import YosysNotFound, find_yosys
          try:
              y = find_yosys()
          except YosysNotFound as e:
              print('FATAL: yosys was installed but is not usable.\n', e)
              sys.exit(1)
          print('yosys:', y.describe())
          PY

      # Same reasoning again: on a runner where verilator was just installed, a skipped test
      # means the install achieved nothing and the check silently did not run.
      #
      # Verilator does two jobs here, neither of them the gate. It LINTS -- a comment beginning
      # with the word "verilator" is read as a pragma, which made --lint-only an ERROR while
      # iverilog printed PASS on the same files -- and it re-runs the gate as a SECOND
      # implementation, since the gate's one weakness is having a single simulator behind it.
      - name: The verilator tests can actually run (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          verilator --version || { echo 'FATAL: verilator installed but not usable'; exit 1; }

      - name: Tests
        run: pytest -v

      # Belt and braces. The suite could in principle pass with every `sim` test skipped -- the
      # step above makes that impossible, and this makes it visible.
      - name: The gate, on its own
        run: pytest -m sim -v

      - name: End to end, as a user would
        shell: bash
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, 'tests')
          import fixtures, dwn2rtl
          model, thermometer = fixtures.make_live('n6')
          dwn2rtl.save(model, thermometer, 'ci-model.dwn', run_name='ci')
          PY
          dwn2rtl build ci-model.dwn --out ci-rtl --input-bits 8
          dwn2rtl verify ci-rtl

  # ⚠️ THE DECLARED DEPENDENCY FLOORS, ACTUALLY INSTALLED. pyproject says numpy>=1.22 and
  # torch>=2.0, and until this job existed both were claims: every run resolved to the newest
  # release, so the oldest supported versions had never executed a line. Same reasoning as the
  # 3.10 entry in the matrix above.
  #
  # Python 3.10 because it is the newest interpreter with real WHEELS for both floors. Checked
  # rather than assumed: numpy 1.22 does resolve on 3.11, but only as an sdist that pip then
  # compiles, which needs a toolchain and minutes. A floor job that spends its time building
  # numpy is testing pip, not this package.
  floors:
    name: the declared dependency floors
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - name: Install iverilog
        timeout-minutes: 15
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            echo 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get update -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15
          sudo apt-get install -y -o DPkg::Lock::Timeout=600 iverilog

      # Installed, then pinned DOWN: `pip install -e .` resolves to the newest that satisfies
      # >=, which is exactly the thing this job exists not to test.
      - name: Install at the floors
        run: |
          pip install -e ".[dev]"
          pip install "numpy==1.22.*" "torch==2.0.*"
          python -c "import numpy, torch; print('numpy', numpy.__version__, '/ torch', torch.__version__)"

      - name: The gate actually ran
        run: |
          python - <<'PY'
          import sys
          from dwn2rtl.verify import SimulatorNotFound, find_simulator
          try:
              print('simulator:', find_simulator().describe())
          except SimulatorNotFound as e:
              print('FATAL: no simulator in CI.\n', e); sys.exit(1)
          PY

      - run: pytest -q

  # The wheel is the thing users actually install, and a development install cannot check it:
  # `pip install -e` leaves the source tree in place, so files('dwn2rtl')/'rtl' resolves back
  # into the repo and a completely missing package-data block would look perfectly healthy.
  # See the phase 0 ledger.
  package:
    name: the wheel contains the RTL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install build
      - run: python -m build --wheel

      - name: Install the wheel somewhere with no source tree
        timeout-minutes: 15
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # Same mirror override as the test job -- this step had the identical exposure to the
          # unreachable azure mirror and had simply not drawn it yet.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            echo 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get update -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15
          sudo apt-get install -y -o DPkg::Lock::Timeout=600 iverilog
          mkdir -p /tmp/elsewhere
          pip install dist/*.whl

      # Run from a directory that is NOT the repo, so nothing can resolve by accident.
      - name: Build and verify from the installed wheel alone
        working-directory: /tmp/elsewhere
        run: |
          python - <<'PY'
          from importlib.resources import files
          rtl = files('dwn2rtl') / 'rtl'
          need = ['lut_node.v', 'popcount.v', 'argmax.v', 'pipe_reg.v']
          missing = [n for n in need if not (rtl / n).is_file()]
          assert not missing, f'the wheel is missing {missing}'
          for tb in ['dwn_core_tb.v', 'dwn_top_tb.v']:
              assert (rtl / 'tb' / tb).read_text().strip(), f'{tb} is empty in the wheel'
          print('wheel carries', len(need) + 2, 'Verilog files')
          PY
          python -c "import sys; sys.path.insert(0, '$GITHUB_WORKSPACE/tests'); import fixtures, dwn2rtl; m,t = fixtures.make_live('tiny'); dwn2rtl.save(m,t,'m.dwn')"
          dwn2rtl build m.dwn --out rtl --input-bits 8
          dwn2rtl verify rtl
