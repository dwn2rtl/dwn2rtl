[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "dwn2rtl"
version = "0.1.0"
description = "Turn a trained Differentiable Weightless Neural Network into synthesizable Verilog, and prove the Verilog matches the model"
readme = "README.md"
# Names without addresses, deliberately. PyPI renders these on a public, heavily scraped page
# and a published version's metadata cannot be edited afterwards. Contact goes through Issues,
# which [project.urls] below links -- add emails here before 1.0 if that proves too indirect.
authors = [
    { name = "Krithik Sama" },
    { name = "Kanishk Sama" },
]
# >=3.10 because that is torch's own floor (torch 2.13 declares Requires-Python >=3.10), and a
# floor this project cannot install is not a floor. It said >=3.9 until phase 2, which was a
# claim rather than a fact: nothing had ever run there, and `tomllib` -- used by the test that
# keeps this file's version and __init__.py's in step -- is stdlib only from 3.11.
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["dwn", "fpga", "verilog", "rtl", "weightless", "neural-network"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Code Generators",
]

# numpy does all the real work -- every emitter and the golden model are pure numpy.
# torch is needed ONLY to read a checkpoint (torch.load, and the tensors inside it).
# Keeping that boundary sharp is deliberate: it is what would make a torch-free path
# possible later via an .npz intermediate, without rewriting anything downstream.
dependencies = [
    "numpy>=1.22",
    "torch>=2.0",
]

# The PyPI sidebar. Without it the project page has no route back to the source, and the README
# rendered there is the only thing most visitors ever read. Documentation points at the overview
# rather than the repo root so the link means something different from Homepage.
[project.urls]
Homepage = "https://github.com/dwn2rtl/dwn2rtl"
Repository = "https://github.com/dwn2rtl/dwn2rtl"
Issues = "https://github.com/dwn2rtl/dwn2rtl/issues"
Documentation = "https://github.com/dwn2rtl/dwn2rtl/blob/main/docs/overview.md"

[project.optional-dependencies]
dev = ["pytest>=7"]

# This is what makes `dwn2rtl` a terminal command. pip reads it and writes a launcher
# into the same Scripts/ (Windows) or bin/ (POSIX) directory pip itself lives in, which
# is already on PATH. The launcher imports this package and calls main() -- so the CLI
# and `import dwn2rtl` are the same installed code, not two products. See overview.md §2.
[project.scripts]
dwn2rtl = "dwn2rtl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# The hand-written Verilog primitives and testbenches ship INSIDE the package, so a user
# who ran `pip install dwn2rtl` and never cloned anything still has them for `verify` to
# compile against. Without this they are simply absent from the wheel and every emitted
# design references four modules that do not exist on the machine.
[tool.setuptools.package-data]
dwn2rtl = ["rtl/*.v", "rtl/tb/*.v"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "sim: needs a Verilog simulator on PATH -- this is the gate (CLAUDE.md)",
    "yosys: needs yosys installed. Skips when absent, like the sim marker -- estimate is optional by design",
    "verilator: needs verilator. Lints the emitted design and re-runs the gate under a second simulator -- both catch things iverilog alone cannot",
    "real: needs a local set of real trained checkpoints, far too large to commit. Skips when absent, so CI is unaffected. DWN2RTL_STUDY=<dir> points at them; DWN2RTL_REAL=all lifts the size and count caps",
]
